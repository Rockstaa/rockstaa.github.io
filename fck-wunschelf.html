<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --red:#E30613; --red-mid:#C10510; --red-dark:#8E040E;
    --ink:#0E1013; --ink-2:#181B20; --line:#2A2F37;
    --display:'Archivo Black','Arial Black',Impact,sans-serif;
    --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
    --jw:clamp(48px,15vw,66px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--ink);color:#fff;font-family:var(--cond);font-size:17px}
  body{padding:14px 12px 40px;max-width:560px;margin:0 auto}

  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .top img{width:40px;height:40px}
  h1{font-family:var(--display);font-size:21px;line-height:1;margin:0;text-transform:uppercase}
  .sub{font-size:13px;color:#8A929E;text-transform:uppercase;letter-spacing:.14em;margin-top:3px}

  .panel{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8A929E;margin-bottom:4px}
  input,select{width:100%;background:#0E1013;border:1px solid var(--line);color:#fff;border-radius:8px;
    padding:9px 10px;font-family:var(--cond);font-size:17px;font-weight:600}
  input:focus,select:focus{outline:2px solid var(--red);outline-offset:1px}
  input.bad{border-color:var(--red)}
  .tipp{display:flex;align-items:center;gap:6px}
  .tipp input{text-align:center}
  .tipp b{font-family:var(--display);color:var(--red)}
  .load{margin-top:8px;display:flex;align-items:center;gap:10px}
  .load button{flex:0 0 auto;padding:9px 14px;font-size:15px}
  .status{font-size:14px;color:#8A929E;flex:1;line-height:1.3}

  .pitch{position:relative;width:100%;aspect-ratio:4/4.7;border-radius:14px;overflow:hidden;
    background:linear-gradient(#4E8156,#2C5236);border:1px solid var(--line);touch-action:pan-y}
  .stripe{position:absolute;left:0;right:0;height:9.09%;background:rgba(255,255,255,.03)}
  .lines i{position:absolute;border:2px solid rgba(255,255,255,.18);display:block}

  .slot{position:absolute;transform:translate(-50%,-50%);width:var(--jw);cursor:grab;touch-action:none}
  .slot.drag{z-index:6;cursor:grabbing;filter:brightness(1.08)}
  .slot.target svg{outline:none}
  .slot.target::before{content:'';position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);
    width:calc(var(--jw)*1.35);height:calc(var(--jw)*1.35);border-radius:50%;
    border:2px dashed rgba(255,255,255,.8);background:rgba(255,255,255,.12)}
  .slot svg{width:var(--jw);height:calc(var(--jw)*0.92);display:block;
    filter:drop-shadow(0 5px 7px rgba(0,0,0,.4));position:relative}
  .slot .num{font-family:var(--display);fill:#fff}
  .plate{position:absolute;left:50%;top:calc(var(--jw)*0.87);transform:translateX(-50%);
    background:#fff;color:#0E1013;font-weight:700;font-size:11.5px;letter-spacing:.06em;
    text-transform:uppercase;line-height:1.4;padding:2px 7px;border-radius:4px;white-space:nowrap;
    box-shadow:0 2px 5px rgba(0,0,0,.35)}
  .slot.empty svg{opacity:.38}
  .slot.empty .plate{background:rgba(255,255,255,.7);color:#5A646F}

  .benchbar{margin-top:12px;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:10px}
  .benchbar .cap{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8A929E;margin-bottom:8px}
  .bench{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .bslot{text-align:center;cursor:pointer}
  .bslot svg{width:100%;max-width:46px;height:auto;display:block;margin:0 auto}
  .bslot .bn{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    margin-top:3px;color:#C6CCD4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bslot.empty svg{opacity:.32}
  .bslot.empty .bn{color:#5A646F}

  .row{display:flex;gap:8px;margin-top:12px}
  button{flex:1;font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;
    border:0;border-radius:10px;padding:14px 12px;background:var(--red);color:#fff;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:#C6CCD4}
  button:active{transform:translateY(1px)}
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
  .seg button{border-radius:0;background:transparent;color:#8A929E;border-right:1px solid var(--line);font-size:15px;padding:11px 8px}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--red);color:#fff}

  .sheet{position:fixed;left:0;right:0;top:0;height:100%;height:100dvh;
    background:rgba(0,0,0,.6);display:none;z-index:20;align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  /* Feste Höhe: sonst schrumpft das Sheet bei jedem Tastendruck mit der
     gefilterten Liste mit. Gescrollt wird innen. */
  .sheet-inner{background:var(--ink-2);width:100%;max-width:560px;height:88%;max-height:780px;
    overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;scrollbar-gutter:stable;
    border-radius:16px 16px 0 0;border-top:3px solid var(--red);
    padding:0 12px calc(20px + env(safe-area-inset-bottom));
    transition:transform .22s ease;
    scrollbar-width:thin;scrollbar-color:#454C57 transparent}
  .sheet-inner::after{content:'';display:block;position:sticky;bottom:-1px;height:46px;
    margin:-46px -12px 0;background:linear-gradient(rgba(24,27,32,0),var(--ink-2));pointer-events:none}
  .sheet-inner::-webkit-scrollbar{width:9px}
  .sheet-inner::-webkit-scrollbar-track{background:transparent;margin:56px 0 8px}
  .sheet-inner::-webkit-scrollbar-thumb{background:#454C57;border-radius:99px;border:3px solid var(--ink-2);min-height:44px}
  .sheet-inner::-webkit-scrollbar-thumb:hover{background:var(--red)}
  body.locked{overflow:hidden}
  .grab{width:42px;height:4px;border-radius:99px;background:#3A414B;margin:0 auto 10px;touch-action:none;cursor:grab}
  .sheet-head{position:sticky;top:0;background:var(--ink-2);padding:10px 0 8px;z-index:2;
    box-shadow:0 10px 12px -10px rgba(0,0,0,.6)}
  .sheet-head .bar{display:flex;align-items:center;gap:10px}
  .sheet h2{font-family:var(--display);font-size:16px;text-transform:uppercase;margin:0;flex:1}
  .sheet h2 small{display:block;font-family:var(--cond);font-size:13px;font-weight:600;
    letter-spacing:.14em;color:var(--red);margin-top:2px}
  .x{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:#232830;color:#C6CCD4;
    font-size:20px;line-height:32px;text-align:center;cursor:pointer}
  .search{margin-top:10px}
  .group{font-size:12px;letter-spacing:.16em;color:#8A929E;text-transform:uppercase;margin:12px 0 6px}
  .p{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer}
  .p:active{background:#232830}
  .p .n{font-family:var(--display);font-size:14px;color:var(--red);min-width:30px}
  .p.taken{opacity:.5}
  .p.here{background:#2A1216;box-shadow:inset 0 0 0 1px var(--red-dark)}
  .p .pos{margin-left:auto;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8A929E}
  .p .pos.red{color:var(--red)}
  .none{color:#8A929E;font-size:15px;padding:10px 8px}

  .out{margin-top:14px;text-align:center}
  .out img{width:100%;border-radius:12px;border:1px solid var(--line)}
  .hint{font-size:14px;color:#8A929E;margin-top:8px;line-height:1.35}
  canvas{display:none}
</style>

];
const GRUPPEN = ['Tor','Abwehr','Mittelfeld','Sturm','Weitere'];
let SQUAD = [];
let BY_NR = {};

function buildSquad(list, quelle, stand){
  const map = {};
  list.forEach(p=>{
    const g = GRUPPEN.includes(p[3]) ? p[3] : 'Weitere';
    (map[g] = map[g] || []).push([p[0], p[1], p[2]]);
  });
  SQUAD = GRUPPEN.filter(g=>map[g]).map(g=>({g, p: map[g].sort((a,b)=>a[0]-b[0])}));
  BY_NR = {};
  SQUAD.forEach(gr=>gr.p.forEach(p=>BY_NR[p[0]]=p));
  console.info('Kader:', quelle, stand || '', list.length + ' Spieler');
}

/* Akzeptiert {spieler:[...]} oder ein blankes Array.
   Pro Spieler: nr, name, optional kurz und position. */
function parseKader(j){
  const rows = Array.isArray(j) ? j : (j.spieler || j.kader || []);
  return rows.map(s=>{
    const name = String(s.name || '').trim();
    return [
      s.nr != null ? s.nr : (s.nummer != null ? s.nummer : s.number),
      name,
      (s.kurz || s.short || name.split(' ').filter(Boolean).slice(-1)[0] || name),
      s.position || s.pos || 'Weitere'
    ];
  }).filter(p => p[0] != null && p[1]);
}

function applyKader(list, quelle, stand){
  buildSquad(list, quelle, stand);
  // Rückennummern, die es noch gibt, bekommen den aktuellen Namen
  [lineup, bench].forEach(a => a.forEach((p,i)=>{
    if(p && BY_NR[p[0]]) a[i] = [BY_NR[p[0]][0], BY_NR[p[0]][2]];
  }));
  render();
}

async function loadKader(){
  try{
    const r = await fetch('kader.json?v=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    const list = parseKader(j);
    if(!list.length) throw new Error('leer');
    applyKader(list, 'kader.json', j.stand || j.saison || '');
  }catch(e){
    // Kein Zugriff (etwa bei file://) oder fehlerhafte Datei: eingebauter Kader bleibt
  }
}

const XSPREAD = {1:[50],2:[32,68],3:[19,50,81],4:[12,37.5,62.5,88],5:[9,29.5,50,70.5,91]};

const SHIRT   = 'M27 4 L41 4 C43 15 57 15 59 4 L73 4 L96 19 L87 40 L73 34 L75 88 L25 88 L27 34 L13 40 L4 19 Z';
const SLEEVE_L= 'M27 4 L4 19 L13 40 L27 34 Z';
const SLEEVE_R= 'M73 4 L96 19 L87 40 L73 34 Z';
const COLLAR  = 'M41 4 C43 15 57 15 59 4';
const HEM     = 'M25.6 81 L74.4 81 L75 88 L25 88 Z';

  if(ok) lastGoodForm = v;
  $('#form').classList.toggle('bad', !ok && v.length>0);
  return lastGoodForm;

function roles(f){
  const rows=f.split('-').map(Number).filter(n=>n>0), R=rows.length;
  const out=[{s:'TW',l:'Torwart',g:['Tor']}];
  rows.forEach((n,i)=>{
    for(let j=0;j<n;j++){
      let s='ZM', l='Zentrales Mittelfeld', g=['Mittelfeld'];
      if(i===0){
        if(n>=4 && j===0){s='LV';l='Linksverteidigung';}
        else if(n>=4 && j===n-1){s='RV';l='Rechtsverteidigung';}
        else {s='IV';l='Innenverteidigung';}
        g=['Abwehr'];
      } else if(i===R-1){
        if(n>=3 && j===0){s='LA';l='Linksaußen';g=['Sturm','Mittelfeld'];}
        else if(n>=3 && j===n-1){s='RA';l='Rechtsaußen';g=['Sturm','Mittelfeld'];}
        else {s='ST';l='Sturm';g=['Sturm'];}
      } else if(i===R-2 && (n<=2 || (n===3 && i>=2))){
        g=['Mittelfeld','Sturm'];
        if(n===3 && j===0){s='LM';l='Linkes Mittelfeld';}
        else if(n===3 && j===n-1){s='RM';l='Rechtes Mittelfeld';}
        else {s='OM';l='Offensives Mittelfeld';}
      } else if(i===1 && n<=2){
        s='DM';l='Defensives Mittelfeld';g=['Mittelfeld','Abwehr'];
      } else if(n>=4){
        if(j===0){s='LM';l='Linkes Mittelfeld';}
        else if(j===n-1){s='RM';l='Rechtes Mittelfeld';}
        g=['Mittelfeld','Abwehr'];
      }
      out.push({s,l,g});
    }
  });
  return out.slice(0,11);
}

/* Verteilt die Reihen so, dass Trikot und Namensschild oben wie unten
   immer ins Feld passen - unabhängig vom Seitenverhältnis. */
function spread(pos, topPad, botPad){
  const ys = pos.map(p=>p.y);
  const lo = Math.min(...ys), hi = Math.max(...ys);
  const span = Math.max(1, hi-lo);
  return pos.map(p => ({x:p.x, y: topPad + (p.y-lo)/span * (100-topPad-botPad)}));
}

function layout(f){
  const rows = f.split('-').map(Number).filter(n=>n>0);
  const pos = [{x:50,y:91}];
  const R = rows.length;
  rows.forEach((n,i)=>{
    const y = R===1 ? 45 : 73 + (17-73)*i/(R-1);
    (XSPREAD[n]||XSPREAD[5]).forEach(x=>pos.push({x,y}));
  });
  return pos.slice(0,11);
}

/* ---- Ziehen zum Tauschen ---- */
(function(){
  const pitch = $('#pitch');
  let el=null, i0=null, sx=0, sy=0, moved=false, tgt=null;
  const centers = () => [...document.querySelectorAll('.slot')].map(s=>{
    const r=s.getBoundingClientRect();
    return {s, i:+s.dataset.i, x:r.left+r.width/2, y:r.top+r.height*0.45};
  });
  pitch.addEventListener('pointerdown', e=>{
    const s = e.target.closest('.slot'); if(!s) return;
    el=s; i0=+s.dataset.i; sx=e.clientX; sy=e.clientY; moved=false; tgt=null;
    s.setPointerCapture(e.pointerId);
  });
  pitch.addEventListener('pointermove', e=>{
    if(!el) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved && Math.hypot(dx,dy)<10) return;
    moved=true; el.classList.add('drag');
    el.style.marginLeft=dx+'px'; el.style.marginTop=dy+'px';
    let best=null, bd=1e9;
    centers().forEach(c=>{
      if(c.i===i0) return;
      const d=Math.hypot(c.x-e.clientX, c.y-e.clientY);
      if(d<bd){ bd=d; best=c; }
    });
    document.querySelectorAll('.slot.target').forEach(s=>s.classList.remove('target'));
    tgt = (best && bd<70) ? best.i : null;
    if(tgt!==null) best.s.classList.add('target');
  });
  const end = e=>{
    if(!el) return;
    const wasMoved=moved, from=i0, to=tgt;
    el.classList.remove('drag'); el.style.marginLeft=''; el.style.marginTop='';
    document.querySelectorAll('.slot.target').forEach(s=>s.classList.remove('target'));
    el=null; i0=null; moved=false; tgt=null;
    if(wasMoved){
      if(to!==null && to!==from){
        const t=lineup[from]; lineup[from]=lineup[to]; lineup[to]=t;
      }
      render();
    } else if(from!==null){
      openSheet('xi', from);
    }
  };
  pitch.addEventListener('pointerup', end);
  pitch.addEventListener('pointercancel', end);
})();

function openSheet(a, i){

function where(nr){
  let k = lineup.findIndex(x=>x&&x[0]===nr);
  if(k>-1) return {a:'xi', i:k};
  k = bench.findIndex(x=>x&&x[0]===nr);
  if(k>-1) return {a:'b', i:k};
  return null;
}

function paint(filter){
  const f = formation();
  const role = active.a==='xi' ? (roles(f)[active.i]||{g:[]}) : {g:[]};
  const q = (filter||'').trim().toLowerCase();
  const hit = ([n,full]) => !q || full.toLowerCase().includes(q) || String(n).startsWith(q);
  const list = $('#list'); list.innerHTML = '';

  const row = ([n,full,short], group) => {
    const at = where(n);
    const here = at && at.a===active.a && at.i===active.i;
    const el = document.createElement('div');
    el.className = 'p' + (here?' here':'') + (at&&!here?' taken':'');
    const label = here ? '<span class="pos red">Aufgestellt</span>'
      : at ? '<span class="pos">Tauscht mit '+(at.a==='b'?'Bank '+(at.i+1):(roles(f)[at.i]||{s:'Pos'}).s)+'</span>'
      : '<span class="pos">'+group+'</span>';
    el.innerHTML = '<span class="n">'+n+'</span><span>'+full+'</span>'+label;
    el.onclick = ()=>{
      if(here){ close(); return; }
      if(at) arr(at.a)[at.i] = arr(active.a)[active.i];
      arr(active.a)[active.i] = [n,short];
      close();
    };
    return el;
  };
  const sec = txt => list.insertAdjacentHTML('beforeend','<div class="group">'+txt+'</div>');

  const rec = [];
  (role.g||[]).forEach(g=>{
    const gr = SQUAD.find(s=>s.g===g);
    if(gr) gr.p.forEach(p=>{ if(hit(p) && !where(p[0])) rec.push([p,g]); });
  });
  if(rec.length){
    sec('Passend für ' + role.s + ' · frei');
    rec.forEach(([p,g])=>list.appendChild(row(p,g)));
  }

  sec('Gesamter Kader');
  let any=false;
  SQUAD.forEach(gr=>{
    const ps = gr.p.filter(hit);
    if(!ps.length) return;
    any=true;
    list.insertAdjacentHTML('beforeend','<div class="group">'+gr.g+'</div>');
    ps.forEach(p=>list.appendChild(row(p,gr.g)));
  });
  if(!any) list.insertAdjacentHTML('beforeend','<div class="none">Kein Spieler gefunden.</div>');

  sec('Sonstiges');
  const free = document.createElement('div');
  free.className='p'; free.innerHTML='<span class="n">+</span><span>Freier Name / Nummer</span>';
  free.onclick=()=>{
    const name = prompt('Name (wird groß dargestellt):',''); if(name===null) return;
    const nr = prompt('Rückennummer:','');
    arr(active.a)[active.i] = [nr||'', name.trim()||'?']; close();
  };
  list.appendChild(free);
  if(arr(active.a)[active.i]){
    const empty = document.createElement('div');
    empty.className='p'; empty.innerHTML='<span class="n">×</span><span>Platz leeren</span>';
    empty.onclick=()=>{ arr(active.a)[active.i]=null; close(); };
    list.appendChild(empty);
  }
}

function dragHandle(el){
  const inner = $('.sheet-inner');
  let y0=null;
  el.ontouchstart = e => { y0 = e.touches[0].clientY; };
  el.ontouchmove = e => {
    if(y0===null) return;
    const dy = Math.max(0, e.touches[0].clientY - y0);
    inner.style.transition='none'; inner.style.transform='translateY('+dy+'px)';
  };
  const end = e => {
    const dy = y0===null?0:(e.changedTouches[0].clientY - y0);
    y0=null; inner.style.transition=''; inner.style.transform='';
    if(dy>90) close();
  };
  el.ontouchend = end; el.ontouchcancel = end;
}

/* ---- Link teilen ---- */
function enc(p){
  if(!p) return '-';
  const s = BY_NR[p[0]];
  return (s && s[2]===p[1]) ? String(p[0]) : p[0]+'~'+encodeURIComponent(p[1]);
}
function dec(t){
  if(t==='-'||!t) return null;
  if(t.includes('~')){ const [n,nm]=t.split('~'); return [n, decodeURIComponent(nm)]; }
  const s = BY_NR[+t];
  return s ? [s[0], s[2]] : [t, t];
}
function toHash(){
  const p = new URLSearchParams();
  p.set('f', formation());
  p.set('x', lineup.map(enc).join('.'));
  if(bench.some(Boolean)) p.set('b', bench.map(enc).join('.'));
  p.set('o', $('#opp').value);
  p.set('t', ($('#th').value||'0')+'-'+($('#ta').value||'0'));
  p.set('s', $('#sub').value);
  return p.toString();
}
function fromHash(){
  const h = location.hash.slice(1);
  if(!h) return;
  const p = new URLSearchParams(h);
  if(p.get('f')){ $('#form').value = p.get('f'); }
  if(p.get('x')) lineup = p.get('x').split('.').map(dec).slice(0,11);
  while(lineup.length<11) lineup.push(null);
  if(p.get('b')){ bench = p.get('b').split('.').map(dec).slice(0,5); while(bench.length<5) bench.push(null); }
  if(p.get('o')) $('#opp').value = p.get('o');
  if(p.get('t')){ const [a,b]=p.get('t').split('-'); $('#th').value=a; $('#ta').value=b; }
  if(p.get('s')) $('#sub').value = p.get('s');
}
$('#link').onclick = async ()=>{
  const url = location.href.split('#')[0] + '#' + toHash();
  try{ await navigator.clipboard.writeText(url); $('#link').textContent='Kopiert'; }
  catch(e){ location.hash = toHash(); $('#link').textContent='In der Adresszeile'; }
  setTimeout(()=>$('#link').textContent='Link kopieren',1800);
};

/* ---- OpenLigaDB ---- */
function season(){ const d=new Date(); return d.getMonth()>=6 ? d.getFullYear() : d.getFullYear()-1; }
async function loadNextMatch(){
  const st = $('#status');
  st.textContent = 'Lade nächstes Spiel …';
  try{
    const r = await fetch('https://api.openligadb.de/getmatchdata/bl2/'+season());
    const games = await r.json();
    // Die Api liefert je nach Version camelCase oder PascalCase
    const v = (o,k) => o ? (o[k] !== undefined ? o[k] : o[k[0].toUpperCase()+k.slice(1)]) : undefined;
    const names = g => (v(v(g,'team1'),'teamName')||'') + ' ' + (v(v(g,'team2'),'teamName')||'');
    const when = g => new Date(v(g,'matchDateTime')).getTime();
    const now = Date.now();
    const next = games.filter(g => /kaiserslautern/i.test(names(g)))
      .filter(g => !v(g,'matchIsFinished') && when(g) > now - 3*3600e3)
      .sort((a,b)=> when(a)-when(b))[0];
    if(!next){ st.textContent = 'Kein kommendes Spiel gefunden.'; return; }
    const home = /kaiserslautern/i.test(v(v(next,'team1'),'teamName')||'');
    const foe = home ? v(next,'team2') : v(next,'team1');
    const foeName = v(foe,'shortName') || v(foe,'teamName') || '';
    $('#opp').value = foeName;
    const d = new Date(when(next));
    const day = d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
    const time = d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
    const grp = v(v(next,'group'),'groupName');
    $('#sub').value = (grp ? grp+' · ' : '') + day + ' · ' + time + ' Uhr · ' + (home?'Heim':'Auswärts');
    st.textContent = (home?'Heimspiel gegen ':'Auswärts bei ') + foeName;
    oppImg = null;
    const icon = v(foe,'teamIconUrl');
    if(icon){
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = ()=>{ oppImg = im; };
      im.onerror = ()=>{ oppImg = null; };
      im.src = icon;
    }
  }catch(e){
    st.textContent = 'Spielplan nicht erreichbar — Gegner bitte von Hand eintragen.';
  }
}

/* ---------------- Canvas ---------------- */
const RED='#E30613', RED_MID='#C10510', INK='#0E1013';
const P_SHIRT=new Path2D(SHIRT), P_SL=new Path2D(SLEEVE_L), P_SR=new Path2D(SLEEVE_R),
      P_HEM=new Path2D(HEM), P_COL=new Path2D(COLLAR);
const D='"Archivo Black","Arial Black",Impact,sans-serif';
const C='"Barlow Condensed","Arial Narrow",Arial,sans-serif';

function fit(ctx,text,max,size,family,min,weight){
  let s=size;
  const set=v=>ctx.font=(weight?weight+' ':'')+v+'px '+family;
  set(s);
  while(ctx.measureText(text).width>max && s>(min||14)){ s-=1; set(s); }
  return s;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
async function ready(){
  try{
    await Promise.all([
      document.fonts.load('400 40px "Archivo Black"'),
      document.fonts.load('700 26px "Barlow Condensed"'),
      document.fonts.load('600 26px "Barlow Condensed"')
    ]);
    await document.fonts.ready;
  }catch(e){}
  if(!crestImg.complete){ try{ await crestImg.decode(); }catch(e){} }
}
/* Wappen bringen unterschiedlich viel Leerraum mit. Wir messen den
   sichtbaren Bereich einmal und zeichnen den auf feste Kantenlänge. */
function trimRect(img){
  try{
    const w = img.naturalWidth, h = img.naturalHeight;
    if(!w || !h) return null;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d', {willReadFrequently:true});
    x.drawImage(img, 0, 0);
    const d = x.getImageData(0, 0, w, h).data;
    let x0=w, y0=h, x1=-1, y1=-1;
    for(let y=0; y<h; y++){
      for(let px=0; px<w; px++){
        if(d[(y*w+px)*4+3] > 12){
          if(px<x0) x0=px; if(px>x1) x1=px;
          if(y<y0) y0=y;  if(y>y1) y1=y;
        }
      }
    }
    if(x1<x0 || y1<y0) return null;
    return {sx:x0, sy:y0, sw:x1-x0+1, sh:y1-y0+1};
  }catch(e){ return null; }   // fremdes Bild ohne CORS-Freigabe
}
const trimCache = new WeakMap();
function drawLogo(ctx, img, cx, cy, box){
  if(!img || !img.complete || !img.naturalWidth) return false;
  if(!trimCache.has(img)) trimCache.set(img, trimRect(img));
  const t = trimCache.get(img);
  const sx = t ? t.sx : 0, sy = t ? t.sy : 0;
  const sw = t ? t.sw : img.naturalWidth, sh = t ? t.sh : img.naturalHeight;
  const k = Math.min(box/sw, box/sh);
  try{ ctx.drawImage(img, sx, sy, sw, sh, cx-sw*k/2, cy-sh*k/2, sw*k, sh*k); }
  catch(e){ return false; }
  return true;
}

function drawJersey(ctx,cx,cy,w,num){
  const h=w*0.92;
  ctx.save();
  ctx.translate(cx-w/2, cy-h/2);
  ctx.scale(w/100, h/92);
  ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=18; ctx.shadowOffsetY=9;
  ctx.fillStyle = num!==null ? RED : 'rgba(227,6,19,.4)';
  ctx.fill(P_SHIRT);
  ctx.shadowColor='transparent';
  if(num!==null){
    ctx.fillStyle=RED_MID; ctx.fill(P_SL); ctx.fill(P_SR);
    ctx.globalAlpha=.45; ctx.fillStyle='#A80410'; ctx.fill(P_HEM); ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.stroke(P_COL);
  }
  ctx.restore();
  if(num!==null && num!==''){
    const s=String(num);
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#fff';
    const fs=fit(ctx,s,w*(s.length>1?0.46:0.26),w*0.40,D,14);
    ctx.font=fs+'px '+D;
    ctx.fillText(s,cx,cy+h*0.16);
  }
}
function plate(ctx,cx,y,name,maxW,size,W){
  const fs=fit(ctx,name,maxW-26,size,C,13,'700');
  ctx.font='700 '+fs+'px '+C;
  if('letterSpacing' in ctx) ctx.letterSpacing='1.2px';
  const tw=ctx.measureText(name).width;
  const bw=Math.min(tw+24,maxW), bh=fs+14;
  const bx=Math.min(Math.max(cx-bw/2,10),W-bw-10);
  ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=9; ctx.shadowOffsetY=3;
  ctx.fillStyle='#fff'; roundRect(ctx,bx,y,bw,bh,5); ctx.fill();
  ctx.shadowColor='transparent';
  ctx.fillStyle=INK; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(name,bx+bw/2,y+bh/2+1);
  if('letterSpacing' in ctx) ctx.letterSpacing='0px';
}

async function draw(){
  await ready();
  const f = formation();
  const SIZE = {'45':[1080,1350], '916':[1080,1920], '11':[1080,1080]}[fmt];
  const cv=$('#cv'), ctx=cv.getContext('2d');
  cv.width=SIZE[0]; cv.height=SIZE[1];
  const W=cv.width, H=cv.height;
  ctx.fillStyle=INK; ctx.fillRect(0,0,W,H);

  const HH=164, FOOT=132;
  const benchOn = bench.some(Boolean);
  const BENCH = benchOn ? 176 : 0;

  /* Kopf */
  ctx.fillStyle='#14171C'; ctx.fillRect(0,0,W,HH);
  ctx.fillStyle=RED; ctx.fillRect(0,HH-5,W,5);
  ctx.textBaseline='middle';
  drawLogo(ctx, crestImg, 92, 82, 104);
  ctx.textAlign='left';
  ctx.fillStyle='#7C8590'; ctx.font='600 27px '+C;
  ctx.fillText('VS.',160,84);
  // Steht das Gegnerwappen, spricht es für sich - der Name bleibt dann weg
  if(!drawLogo(ctx, oppImg, 250, 82, 104)){
    const opp=($('#opp').value||'').toUpperCase();
    const os=fit(ctx,opp,300,34,D,16);
    ctx.fillStyle='#fff'; ctx.font=os+'px '+D;
    ctx.fillText(opp,214,84);
  }

  [['Formation',f],['Tipp',(($('#th').value||'0')+':'+($('#ta').value||'0'))]].forEach(([lab,val],i)=>{
    const bw=152,bh=98,bx=W-40-(2-i)*(bw+14),by=31;
    ctx.fillStyle='#fff'; roundRect(ctx,bx,by,bw,bh,7); ctx.fill();
    ctx.textAlign='center';
    ctx.fillStyle='#7C8590'; ctx.font='600 19px '+C;
    ctx.fillText(lab.toUpperCase(),bx+bw/2,by+27);
    const vs=fit(ctx,val,bw-22,36,D,17);
    ctx.fillStyle=RED; ctx.font=vs+'px '+D;
    ctx.fillText(val,bx+bw/2,by+66);
  });

  /* Platz */
  const PY=HH, PW=W, PH=H-HH-FOOT-BENCH;
  const g=ctx.createLinearGradient(0,PY,0,PY+PH);
  g.addColorStop(0,'#4E8156'); g.addColorStop(1,'#2C5236');
  ctx.fillStyle=g; ctx.fillRect(0,PY,PW,PH);
  ctx.fillStyle='rgba(255,255,255,.03)';
  for(let i=0;i<11;i+=2) ctx.fillRect(0,PY+i*PH/11,PW,PH/11);
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=3;
  ctx.strokeRect(34,PY+24,PW-68,PH-48);
  ctx.beginPath(); ctx.moveTo(34,PY+PH/2); ctx.lineTo(PW-34,PY+PH/2); ctx.stroke();
  ctx.beginPath(); ctx.arc(PW/2,PY+PH/2,94,0,7); ctx.stroke();
  ctx.strokeRect(PW*0.31,PY+24,PW*0.38,PH*0.13);
  ctx.strokeRect(PW*0.31,PY+PH-24-PH*0.13,PW*0.38,PH*0.13);

  /* Elf */
  const raw=layout(f), rl=roles(f);
  const rowCount={};
  raw.forEach(p=>rowCount[p.y]=(rowCount[p.y]||0)+1);
  const scale = Math.max(0.72, Math.min(1.18, PH/1050));
  const JWbase = 116*scale, JWdense = 100*scale;
  const padTop = JWbase*0.62/PH*100;
  const padBot = (JWbase*0.5 + 46*scale)/PH*100;
  const pos = spread(raw, padTop, padBot);
  pos.forEach((p,i)=>{
    const pl=lineup[i];
    const dense=rowCount[raw[i].y]>=5;
    const JW=dense?JWdense:JWbase;
    const cx=(0.04+p.x/100*0.92)*PW, cy=PY+p.y/100*PH;
    drawJersey(ctx,cx,cy,JW,pl?pl[0]:null);
    const name=(pl?pl[1]:(rl[i]?rl[i].s:'—')).toUpperCase();
    if(pl) plate(ctx,cx,cy+JW*0.44,name,(dense?152:184)*scale,27*scale,W);
    else {
      ctx.font='700 '+(22*scale)+'px '+C; ctx.fillStyle='rgba(255,255,255,.6)';
      ctx.textAlign='center'; ctx.fillText(name,cx,cy+JW*0.55);
    }
  });

  /* Bank */
  if(benchOn){
    const BY=H-FOOT-BENCH;
    ctx.fillStyle='#101318'; ctx.fillRect(0,BY,W,BENCH);
    ctx.fillStyle='#7C8590'; ctx.font='600 20px '+C; ctx.textAlign='left';
    if('letterSpacing' in ctx) ctx.letterSpacing='3px';
    ctx.fillText('ERSATZBANK',40,BY+30);
    if('letterSpacing' in ctx) ctx.letterSpacing='0px';
    const used = bench.filter(Boolean);
    used.forEach((pl,i)=>{
      const cx = (i+0.5)/used.length*W;
      drawJersey(ctx,cx,BY+86,74,pl[0]);
      ctx.font='700 20px '+C; ctx.fillStyle='#C6CCD4'; ctx.textAlign='center';
      const nm=pl[1].toUpperCase();
      fit(ctx,nm,W/used.length-20,20,C,12,'700');
      ctx.fillText(nm,cx,BY+142);
    });
  }

  /* Fuß */
  ctx.fillStyle='#14171C'; ctx.fillRect(0,H-FOOT,W,FOOT);
  ctx.fillStyle=RED; ctx.fillRect(0,H-FOOT,W,4);
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.font='34px '+D;
  ctx.fillText('MEINE WUNSCHELF',40,H-80);
  ctx.fillStyle='#7C8590';
  const ss=fit(ctx,($('#sub').value||'').toUpperCase(),W-220,25,C,14,'600');
  ctx.font='600 '+ss+'px '+C;
  if('letterSpacing' in ctx) ctx.letterSpacing='2px';
  ctx.fillText(($('#sub').value||'').toUpperCase(),40,H-42);
  if('letterSpacing' in ctx) ctx.letterSpacing='0px';
  drawLogo(ctx, crestImg, W-76, H-68, 84);
  return cv;
}
function toBlob(cv){ return new Promise(r=>cv.toBlob(r,'image/png')); }

$('#make').onclick = async ()=>{
  const btn=$('#make'); btn.textContent='Zeichne …';
  let cv = await draw(), url;
  try{ url = cv.toDataURL('image/png'); }
  catch(e){ oppImg=null; cv = await draw(); url = cv.toDataURL('image/png'); }
  btn.textContent='Bild erzeugen';
  const out=$('#out');
  out.innerHTML='<img id="shot" src="'+url+'" alt="Wunschelf">'+
    '<div class="row"><button id="sh">Teilen / Sichern</button>'+
    '<button class="ghost" id="cp">Kopieren</button></div>'+
    '<div class="hint">Bild lange drücken → „Bild sichern" klappt immer.</div>';
  $('#sh').onclick=async()=>{
    try{
      const blob=await toBlob(cv);
      const file=new File([blob],'wunschelf.png',{type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Meine Wunschelf'}); return; }
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='wunschelf.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    }catch(e){ $('.hint').textContent='Browser blockiert das Speichern hier. Bild lange drücken → „Bild sichern".'; }
  };
  $('#cp').onclick=async()=>{
    try{ await navigator.clipboard.write([new ClipboardItem({'image/png':await toBlob(cv)})]); $('#cp').textContent='Kopiert'; }
    catch(e){ $('#cp').textContent='Geht hier nicht'; }
    setTimeout(()=>$('#cp').textContent='Kopieren',1600);
  };
  out.scrollIntoView({behavior:'smooth',block:'start'});
};

let rt;
addEventListener('resize', ()=>{
  if($('#sheet').classList.contains('open')) return;
  clearTimeout(rt); rt=setTimeout(render,150);
});

buildSquad(KADER_FALLBACK, 'Eingebauter Kader', '2026/27');
const ausLink = location.hash.length > 1;
fromHash();
render();
loadKader();
if(ausLink) $('#status').textContent = 'Aufstellung aus geteiltem Link';
else loadNextMatch();
</script>
