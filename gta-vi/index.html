  :root {
    --sky-0: #12032a;
    --sky-1: #3b0d63;
    --sky-2: #8a1e86;
    --sky-3: #e23a8c;
    --sky-4: #ff7a59;
    --sky-5: #ffc06b;
    --sun-0: #fff3a8;
    --sun-1: #ffc45e;
    --sun-2: #ff7a59;
    --sun-3: #ff3d8b;
    --sea-0: #2a0b4d;
    --sea-1: #0e0424;
    --grid: #ff4fb4;
    --pink: #ff4fb4;
    --orange: #ffa94d;
    --ink: #1a0628;
    --text: #ffe9f6;
    /* nur für die Ziffern-Kontur, damit das Neon-Flackern nichts anderes betrifft */
    --neon: var(--pink);
    --neon-glow: 1;
    /* werden per JS gesetzt: 0 = Sonne hoch, 1 = untergegangen */
    --sink: 0;
    --night: 0;
  }

  :root[data-theme="leonida"] {
    --sky-0: #020b22;
    --sky-1: #08285a;
    --sky-2: #0f5f8f;
    --sky-3: #18a3b5;
    --sky-4: #4fe0c8;
    --sky-5: #ffe08a;
    --sun-0: #fffbe0;
    --sun-1: #ffe08a;
    --sun-2: #7ef0d8;
    --sun-3: #2bc4e0;
    --sea-0: #06264a;
    --sea-1: #010818;
    --grid: #36e6ff;
    --pink: #36e6ff;
    --orange: #ffd166;
    --ink: #03122b;
    --text: #e8fbff;
  }

  :root.flick { --neon: color-mix(in srgb, var(--pink) 30%, var(--ink)); --neon-glow: 0; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--sky-0);
    color: var(--text);
    font-family: "Archivo Black", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* ---------- Szene ---------- */
  .scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: linear-gradient(180deg,
      var(--sky-0) 0%,
      var(--sky-1) 22%,
      var(--sky-2) 42%,
      var(--sky-3) 56%,
      var(--sky-4) 64%,
      var(--sky-5) 68%);
  }

  .stars {
    position: absolute;
    inset: 0 0 45% 0;
    opacity: calc(.5 + var(--night));
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 27% 8%, #fffc 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 41% 22%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 63% 12%, #fffc 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 26%, #fffa 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 89% 6%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 6% 34%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 54% 4%, #fffc 50%, transparent 51%),
      radial-gradient(1px 1px at 33% 38%, #fff8 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 71% 40%, #fffa 50%, transparent 51%);
  }
  .stars::after {
    content: "";
    position: absolute;
    inset: 0;
    background: inherit;
    transform: translate(3vw, 5vh);
    animation: twinkle 4s ease-in-out infinite alternate;
  }

  .sun {
    position: absolute;
    left: 50%;
    top: 68%;
    width: min(62vmin, 560px);
    aspect-ratio: 1;
    /* versinkt mit --sink immer weiter hinter dem Horizont */
    transform: translate(-50%, calc(-62% + var(--sink) * 62%));
    border-radius: 50%;
    background: linear-gradient(180deg, var(--sun-0) 0%, var(--sun-1) 35%, var(--sun-2) 62%, var(--sun-3) 100%);
    -webkit-mask: linear-gradient(180deg, #000 48%, transparent 48%),
      repeating-linear-gradient(180deg, #000 0 14px, transparent 14px 22px);
    mask: linear-gradient(180deg, #000 48%, transparent 48%),
      repeating-linear-gradient(180deg, #000 0 14px, transparent 14px 22px);
  }

  .sea {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    top: 68%;
    background: linear-gradient(180deg, var(--sea-0), var(--sea-1));
    overflow: hidden;
  }

  .grid {
    position: absolute;
    left: -60%;
    right: -60%;
    top: 0;
    height: 160%;
    background-image:
      linear-gradient(var(--grid) 2px, transparent 2px),
      linear-gradient(90deg, var(--grid) 2px, transparent 2px);
    background-size: 90px 90px;
    background-position: center 0;
    transform-origin: top center;
    transform: perspective(260px) rotateX(68deg);
    opacity: .35;
    -webkit-mask: linear-gradient(180deg, transparent 0, #000 30%);
    mask: linear-gradient(180deg, transparent 0, #000 30%);
    animation: grid-run 2.4s linear infinite;
  }

  .reflection {
    position: absolute;
    left: 50%;
    top: 0;
    width: min(50vmin, 460px);
    height: 100%;
    transform: translateX(-50%);
    background: repeating-linear-gradient(180deg, var(--sun-2) 0 3px, transparent 3px 11px);
    -webkit-mask: linear-gradient(180deg, #000, transparent 70%);
    mask: linear-gradient(180deg, #000, transparent 70%);
    opacity: calc(.55 * (1 - var(--sink)));
    animation: shimmer 3s ease-in-out infinite alternate;
  }

  .sea::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, color-mix(in srgb, var(--pink) 40%, transparent) 0, transparent 2px);
  }

  .night {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #02000a, #0a0220 70%, #02000a);
    opacity: var(--night);
  }

  .plane {
    position: absolute;
    top: 14%;
    left: 0;
    width: 70px;
    fill: var(--ink);
    animation: fly 46s linear infinite;
    animation-delay: -30s;
  }
  .plane .beacon { fill: #ff2b4a; animation: blink 1.2s steps(1) infinite; }

  .birds {
    position: absolute;
    top: 30%;
    left: 0;
    width: 90px;
    stroke: var(--ink);
    stroke-width: 2.4;
    stroke-linecap: round;
    fill: none;
    animation: fly-right 34s linear infinite;
    animation-delay: -8s;
  }
  .birds path { transform-box: fill-box; transform-origin: center; animation: flap .6s ease-in-out infinite alternate; }
  .birds path:nth-child(2) { animation-delay: -.2s; }
  .birds path:nth-child(3) { animation-delay: -.4s; }

  .palm {
    position: absolute;
    bottom: 0;
    height: min(78vh, 720px);
    fill: var(--ink);
    transform-origin: bottom center;
    animation: sway 7s ease-in-out infinite alternate;
  }
  .palm.left  { left: -4vw; }
  .palm.left.back { left: 9vw; height: min(58vh, 520px); opacity: .85; animation-duration: 9s; }
  .palm.right { right: -4vw; transform: scaleX(-1); animation-name: sway-flip; }
  .palm.right.back { right: 10vw; height: min(52vh, 480px); opacity: .85; animation-duration: 8s; }

  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(180deg, #0000 0 2px, #00000014 2px 3px);
    mix-blend-mode: multiply;
    z-index: 5;
  }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

  .flash {
    position: fixed;
    inset: 0;
    background: #fff;
    pointer-events: none;
    opacity: 0;
    z-index: 6;
  }
  .flash.go { animation: flash 1.4s ease-out; }

  /* ---------- Bedienelemente ---------- */
  .toolbar {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 7;
    display: flex;
    gap: 8px;
  }
  .toolbar button {
    font: inherit;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--text);
    background: color-mix(in srgb, var(--ink) 70%, transparent);
    border: 2px solid var(--pink);
    padding: 8px 12px;
    cursor: pointer;
    box-shadow: 0 0 12px color-mix(in srgb, var(--pink) 35%, transparent);
    transition: background .2s, transform .1s;
  }
  .toolbar button:hover { background: color-mix(in srgb, var(--pink) 30%, var(--ink)); }
  .toolbar button:active { transform: translateY(1px); }
  .toolbar button[aria-pressed="true"] { background: var(--pink); color: var(--ink); }
  .toolbar button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ---------- Inhalt ---------- */
  main {
    position: relative;
    z-index: 3;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2.2vh, 26px);
    padding: 56px 16px 16px;
    text-align: center;
  }

  .logo {
    width: min(480px, 74vw);
    max-height: 36vh;
    object-fit: contain;
    /* PNG hat transparenten Rand – etwas wegschneiden */
    margin: -6vh 0 -4.5vh;
    filter: drop-shadow(0 10px 30px color-mix(in srgb, var(--pink) 55%, transparent)) drop-shadow(0 0 2px #0008);
    animation: float 6s ease-in-out infinite;
  }

  .kicker {
    font-size: clamp(11px, 1.5vw, 15px);
    letter-spacing: .38em;
    text-transform: uppercase;
    color: #fff;
    padding: .5em 1.1em;
    background: color-mix(in srgb, var(--ink) 60%, transparent);
    border: 2px solid var(--pink);
    box-shadow: 0 0 18px color-mix(in srgb, var(--pink) 40%, transparent);
    text-shadow: 0 0 10px var(--pink);
  }

  .countdown {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(2px, 1vw, 12px);
  }

  .countdown svg { display: block; overflow: visible; height: min(22vh, 17vw, 200px); width: auto; }

  .unit text {
    font-family: "Archivo Black", system-ui, sans-serif;
    font-size: 19px;
    letter-spacing: 3px;
    fill: var(--orange);
    paint-order: stroke;
    stroke: var(--ink);
    stroke-width: 5px;
    stroke-linejoin: round;
    text-transform: uppercase;
  }

  .digit.pop { animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); transform-box: fill-box; transform-origin: center; }

  .done .countdown svg.outnow { height: min(26vh, 15vw, 220px); animation: slam .9s cubic-bezier(.2, 1.4, .4, 1); }

  .date {
    font-size: clamp(13px, 2vw, 20px);
    letter-spacing: .22em;
    color: #fff;
    text-shadow: 0 0 14px var(--pink), 0 2px 0 var(--ink);
  }
  .date span { color: var(--pink); text-shadow: 0 2px 0 var(--ink); }

  .wanted {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .wanted-label, .wanted-next {
    font-size: clamp(9px, 1.2vw, 12px);
    letter-spacing: .2em;
    text-transform: uppercase;
    text-shadow: 0 2px 0 var(--ink);
  }
  .wanted-label { color: var(--orange); }
  .wanted-next { color: #fff; opacity: .8; }
  .stars-row { display: flex; gap: clamp(4px, .8vw, 10px); }
  .stars-row svg {
    width: clamp(26px, 3.4vw, 40px);
    height: auto;
    overflow: visible;
    fill: #ffffff2e;
    stroke: var(--ink);
    stroke-width: 2.5;
    stroke-linejoin: round;
  }
  .stars-row svg.on {
    fill: #fff;
    filter: drop-shadow(0 0 6px var(--pink));
  }
  /* der nächste Stern blinkt, wie im Spiel kurz bevor das Level steigt */
  .stars-row svg.next { animation: wanted-blink .8s steps(1) infinite; }
  .done .stars-row svg { animation: siren .5s steps(1) infinite; }
  .done .stars-row svg:nth-child(even) { animation-delay: -.25s; }

  .done .kicker { font-size: clamp(14px, 2.4vw, 24px); letter-spacing: .25em; }

  @media (max-width: 640px) {
    .countdown {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 4px 14px;
    }
    .sep { display: none; }
    .countdown svg { height: min(17vh, 32vw); }
    .done .countdown { display: flex; }
    .done .countdown svg.outnow { height: auto; width: 88vw; }
    .logo { margin: -4vh 0 -3vh; }
    .toolbar { left: 14px; justify-content: center; }
    .toolbar button { padding: 7px 9px; font-size: 10px; }
  }

  @keyframes float   { 50% { transform: translateY(-8px); } }
  @keyframes twinkle { to { opacity: .2; } }
  @keyframes shimmer { to { transform: translateX(-50%) scaleX(1.12); } }
  @keyframes grid-run { to { background-position: center 90px; } }
  @keyframes sway      { from { transform: rotate(-1.2deg); } to { transform: rotate(1.4deg); } }
  @keyframes sway-flip { from { transform: scaleX(-1) rotate(-1.2deg); } to { transform: scaleX(-1) rotate(1.4deg); } }
  @keyframes fly       { from { transform: translateX(110vw); } to { transform: translateX(-20vw); } }
  @keyframes fly-right { from { transform: translateX(-20vw); } to { transform: translateX(115vw); } }
  @keyframes flap  { from { transform: scaleY(1); } to { transform: scaleY(-.5); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pop   { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes slam  { 0% { transform: scale(2.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes wanted-blink { 50% { fill: #fff; filter: drop-shadow(0 0 6px var(--pink)); } }
  @keyframes siren { 0% { filter: drop-shadow(0 0 8px #ff2b4a); } 50% { filter: drop-shadow(0 0 8px #2b7bff); } }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- Filter: weiße Blockschrift mit dunkler Kontur + Neon-Außenkontur, wie im Logo.
     Die Farben kommen über CSS (flood-color), damit Farbschema und Flackern greifen. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="gta" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="b0"/>
      <feComponentTransfer in="b0" result="shape"><feFuncA type="linear" slope="14" intercept="-6"/></feComponentTransfer>

      <feMorphology in="shape" operator="dilate" radius="6.5" result="d1raw"/>
      <feGaussianBlur in="d1raw" stdDeviation="1.4" result="d1b"/>
      <feComponentTransfer in="d1b" result="d1"><feFuncA type="linear" slope="14" intercept="-6"/></feComponentTransfer>

      <feMorphology in="shape" operator="dilate" radius="9.5" result="d2raw"/>
      <feGaussianBlur in="d2raw" stdDeviation="1.8" result="d2b"/>
      <feComponentTransfer in="d2b" result="d2"><feFuncA type="linear" slope="14" intercept="-6"/></feComponentTransfer>

      <feFlood style="flood-color: var(--neon)"/><feComposite in2="d2" operator="in" result="neon"/>
      <feFlood style="flood-color: var(--ink)"/><feComposite in2="d1" operator="in" result="dark"/>
      <feFlood flood-color="#ffffff"/><feComposite in2="shape" operator="in" result="white"/>

      <feGaussianBlur in="d2" stdDeviation="9" result="glowShape"/>
      <feFlood style="flood-color: var(--neon); flood-opacity: var(--neon-glow)"/><feComposite in2="glowShape" operator="in" result="glow"/>
      <feOffset in="d2" dy="6" result="dropShape"/>
      <feFlood style="flood-color: var(--ink)" flood-opacity=".55"/><feComposite in2="dropShape" operator="in" result="drop"/>

      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="drop"/>
        <feMergeNode in="neon"/>
        <feMergeNode in="dark"/>
        <feMergeNode in="white"/>
      </feMerge>
    </filter>

    <symbol id="palm" viewBox="0 0 400 700">
      <path d="M196 700 C188 560 170 420 200 300 C214 245 236 205 252 178 L262 184 C246 214 228 254 218 306 C194 424 214 560 224 700 Z"/>
      <g transform="translate(256 176)">
        <path d="M0 0 C-50 -46 -130 -52 -190 -6 C-130 -32 -60 -24 0 6 Z"/>
        <path d="M0 0 C-30 -70 -100 -110 -170 -100 C-100 -84 -44 -48 -4 6 Z"/>
        <path d="M0 0 C10 -70 -20 -130 -70 -160 C-30 -116 -14 -60 -6 4 Z"/>
        <path d="M0 0 C40 -60 100 -84 160 -70 C100 -60 46 -34 4 6 Z"/>
        <path d="M0 0 C60 -20 130 -6 176 44 C120 10 60 0 2 8 Z"/>
        <path d="M0 0 C40 20 80 70 86 136 C66 80 34 40 -2 8 Z"/>
        <path d="M0 0 C-40 16 -100 60 -120 120 C-86 70 -44 32 -2 8 Z"/>
        <circle cx="0" cy="6" r="12"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="scene" aria-hidden="true">
  <div class="sun"></div>
  <div class="sea"><div class="grid"></div><div class="reflection"></div></div>
  <div class="night"></div>
  <div class="stars"></div>
  <svg class="plane" viewBox="0 0 70 24">
    <path d="M2 13 C2 10 8 9 14 9 L52 9 L62 2 L67 2 L62 10 C66 11 68 12 68 13 C68 15 60 16 52 16 L14 16 C8 16 2 15 2 13 Z"/>
    <path d="M26 12 L44 12 L34 23 L29 23 Z"/>
    <circle class="beacon" cx="36" cy="18" r="1.8"/>
  </svg>
  <svg class="birds" viewBox="0 0 90 40">
    <path d="M4 14 Q10 6 16 14 Q22 6 28 14"/>
    <path d="M38 6 Q43 0 48 6 Q53 0 58 6"/>
    <path d="M60 26 Q66 18 72 26 Q78 18 84 26"/>
  </svg>
  <svg class="palm left back" viewBox="0 0 400 700"><use href="#palm"/></svg>
  <svg class="palm left" viewBox="0 0 400 700"><use href="#palm"/></svg>
  <svg class="palm right back" viewBox="0 0 400 700"><use href="#palm"/></svg>
  <svg class="palm right" viewBox="0 0 400 700"><use href="#palm"/></svg>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="flash" id="flash" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="toolbar">
  <button type="button" id="btn-music" aria-pressed="false" title="Musik (M)">♪ Musik</button>
  <button type="button" id="btn-theme" title="Farbschema wechseln (C)">◐ Farben</button>
  <button type="button" id="btn-full" title="Vollbild (F oder Doppelklick)">⛶ Vollbild</button>
</div>

<main id="app">
  <img class="logo" src="GTA-6-Logo-PNG-from-Grand-Theft-Auto-VI-Transparent.png" alt="Grand Theft Auto VI">
  <p class="kicker" id="kicker">Willkommen in Leonida</p>
  <div class="countdown" id="countdown" role="timer" aria-live="off"></div>
  <p class="date">19.11.2026 <span>//</span> 00:00 Uhr</p>
  <div class="wanted">
    <span class="wanted-label">Fahndungslevel</span>
    <div class="stars-row" id="stars"></div>
    <span class="wanted-next" id="wanted-next"></span>
  </div>
</main>

<script>
  // 19.11.2026, 00:00 Uhr deutscher Zeit (MEZ, UTC+1) – unabhängig von der Zeitzone des Geräts.
  // Zum Ausprobieren: index.html?test=10 startet einen 10-Sekunden-Countdown.
  const TEST = Number(new URLSearchParams(location.search).get("test"));
  const RELEASE = TEST > 0 ? Date.now() + TEST * 1000 : new Date("2026-11-19T00:00:00+01:00").getTime();
  // Fahndungslevel: ab dieser Restzeit leuchtet der jeweilige Stern
  const WANTED = [30 * 86400e3, 14 * 86400e3, 7 * 86400e3, 86400e3, 3600e3];
  // In den letzten 30 Tagen versinkt die Sonne langsam, zum Release ist Nacht
  const SUNSET_SPAN = 30 * 86400e3;

  const root = document.documentElement;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  /* ---------- Blockschrift ---------- */

  // Glyphen im Stil der GTA-VI-Wortmarke: dicke Balken, schmale Schlitze als Innenräume.
  // c = Spaltenbreiten, Zeilen immer: dick / schmal / dick / schmal / dick
  const D = [30, 12, 30];
  const ROWS = [24, 12, 24, 12, 24];
  const DIGIT_W = 72, DIGIT_H = 96, GAP = 14;
  const GLYPHS = {
    0: { c: D, b: ["111", "101", "101", "101", "111"] },
    1: { c: [12, 30], b: ["11", "01", "01", "01", "01"] },
    2: { c: D, b: ["111", "001", "111", "100", "111"] },
    3: { c: D, b: ["111", "001", "011", "001", "111"] },
    4: { c: D, b: ["101", "101", "111", "001", "001"] },
    5: { c: D, b: ["111", "100", "111", "001", "111"] },
    6: { c: D, b: ["111", "100", "111", "101", "111"] },
    7: { c: D, b: ["111", "001", "001", "001", "001"] },
    8: { c: D, b: ["111", "101", "111", "101", "111"] },
    9: { c: D, b: ["111", "101", "111", "001", "111"] },
    O: { c: D, b: ["111", "101", "101", "101", "111"] },
    U: { c: D, b: ["101", "101", "101", "101", "111"] },
    T: { c: [24, 30, 24], b: ["111", "010", "010", "010", "010"] },
    N: { c: D, b: ["111", "101", "101", "101", "101"] },
    W: { c: [30, 12, 30, 12, 30], b: ["10101", "10101", "10101", "10101", "11111"] },
  };
  const SVG_NS = "http://www.w3.org/2000/svg";
  const sum = a => a.reduce((x, y) => x + y, 0);
  const glyphWidth = ch => sum(GLYPHS[ch].c);

  // boxW: feste Zellenbreite (Ziffern), Glyphe wird darin zentriert
  function glyphRects(ch, x0, boxW = glyphWidth(ch)) {
    const { c, b } = GLYPHS[ch];
    const offset = (boxW - sum(c)) / 2;
    let out = "";
    b.forEach((row, r) => {
      const y = sum(ROWS.slice(0, r));
      [...row].forEach((bit, i) => {
        if (bit !== "1") return;
        const x = x0 + offset + sum(c.slice(0, i));
        // minimal überlappen, damit keine Haarlinien entstehen
        out += `<rect x="${x - .5}" y="${y - .5}" width="${c[i] + 1}" height="${ROWS[r] + 1}"/>`;
      });
    });
    return out;
  }

  /* ---------- Countdown ---------- */

  const units = [
    { key: "d", label: "Tage" },
    { key: "h", label: "Stunden" },
    { key: "m", label: "Minuten" },
    { key: "s", label: "Sekunden" },
  ];
  const el = document.getElementById("countdown");

  function buildUnit(u, digits) {
    const w = digits * DIGIT_W + (digits - 1) * GAP;
    const pad = 16;
    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", `${-pad} ${-pad} ${w + pad * 2} ${DIGIT_H + pad + 46}`);
    svg.setAttribute("aria-hidden", "true");
    let html = `<g filter="url(#gta)">`;
    for (let i = 0; i < digits; i++) html += `<g class="digit"></g>`;
    html += `</g><text x="${w / 2}" y="${DIGIT_H + 40}" text-anchor="middle">${u.label}</text>`;
    svg.innerHTML = html;
    u.wrap.replaceChildren(svg);
    u.digits = digits;
    u.groups = [...svg.querySelectorAll(".digit")];
    u.value = null;
  }

  units.forEach((u, i) => {
    if (i > 0) {
      const sep = document.createElement("div");
      sep.className = "sep";
      sep.innerHTML = `<svg viewBox="-16 -16 54 158" aria-hidden="true"><g filter="url(#gta)">
        <rect x="0" y="16" width="22" height="20"/><rect x="0" y="60" width="22" height="20"/></g></svg>`;
      el.appendChild(sep);
    }
    u.wrap = document.createElement("div");
    u.wrap.className = "unit";
    el.appendChild(u.wrap);
  });

  function render(u, n) {
    const str = String(n).padStart(2, "0");
    if (u.digits !== str.length) buildUnit(u, str.length);
    const prev = u.value;
    [...str].forEach((d, i) => {
      if (prev && prev[i] === d) return;
      const g = u.groups[i];
      g.innerHTML = glyphRects(d, i * (DIGIT_W + GAP), DIGIT_W);
      if (prev) { g.classList.remove("pop"); void g.getBBox(); g.classList.add("pop"); }
    });
    u.value = str;
  }

  function renderWords(words) {
    const SPACE = 46;
    let x = 0, rects = "";
    words.forEach((word, wi) => {
      if (wi) x += SPACE;
      [...word].forEach((ch, ci) => {
        if (ci) x += GAP;
        rects += glyphRects(ch, x);
        x += glyphWidth(ch);
      });
    });
    const pad = 20;
    el.innerHTML = `<svg class="outnow" viewBox="${-pad} ${-pad} ${x + pad * 2} ${DIGIT_H + pad * 2}" aria-hidden="true">
      <g filter="url(#gta)">${rects}</g></svg>`;
  }

  /* ---------- Sonnenuntergang & Fahndungslevel ---------- */

  const starsEl = document.getElementById("stars");
  const nextEl = document.getElementById("wanted-next");
  starsEl.innerHTML = WANTED.map(() =>
    `<svg viewBox="0 0 40 38" aria-hidden="true"><path d="M20 2 L25 14 L38 14.5 L28 23 L31.5 36 L20 28.5 L8.5 36 L12 23 L2 14.5 L15 14 Z"/></svg>`).join("");
  const starEls = [...starsEl.children];

  function untilText(ms) {
    const d = Math.floor(ms / 86400e3), h = Math.floor(ms / 3600e3) % 24, m = Math.ceil(ms / 60e3) % 60;
    if (d >= 1) return d === 1 ? "1 Tag" : `${d} Tagen`;
    if (h >= 1) return h === 1 ? "1 Stunde" : `${h} Stunden`;
    return m <= 1 ? "1 Minute" : `${m} Minuten`;
  }

  function updateSky(now) {
    const left = RELEASE - now;
    const sink = Math.min(1, Math.max(0, 1 - left / SUNSET_SPAN));
    root.style.setProperty("--sink", sink.toFixed(4));
    root.style.setProperty("--night", (sink * .6).toFixed(4));

    const level = WANTED.filter(t => left <= t).length;
    starEls.forEach((st, i) => {
      st.classList.toggle("on", i < level);
      st.classList.toggle("next", i === level && left > 0);
    });
    starsEl.setAttribute("aria-label", `Fahndungslevel ${level} von 5`);
    nextEl.textContent = left <= 0 ? "Maximale Fahndungsstufe"
      : level < WANTED.length ? `Nächster Stern in ${untilText(left - WANTED[level])}`
      : "Letzte Stunde!";
  }

  /* ---------- Release-Moment ---------- */

  let released = false;

  function celebrate(live) {
    released = true;
    document.getElementById("app").classList.add("done");
    document.getElementById("kicker").textContent = "Es ist soweit. Willkommen in Vice City.";
    document.title = "GTA VI ist da!";
    el.setAttribute("aria-label", "GTA VI ist erschienen");
    renderWords(["OUT", "NOW"]);
    if (live) {
      const f = document.getElementById("flash");
      f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
    }
    confetti.start(live ? 320 : 120);
  }

  const confetti = (() => {
    const cv = document.getElementById("confetti");
    const ctx = cv.getContext("2d");
    let parts = [], running = false, colors = [];

    function resize() {
      cv.width = innerWidth * devicePixelRatio;
      cv.height = innerHeight * devicePixelRatio;
    }
    function spawn(burst) {
      return {
        x: burst ? innerWidth * (.3 + Math.random() * .4) : Math.random() * innerWidth,
        y: burst ? innerHeight * .5 : -20,
        vx: burst ? (Math.random() - .5) * 22 : (Math.random() - .5) * 2,
        vy: burst ? -Math.random() * 18 - 6 : Math.random() * 2 + 1,
        s: Math.random() * 8 + 5,
        r: Math.random() * Math.PI,
        vr: (Math.random() - .5) * .3,
        c: colors[Math.floor(Math.random() * colors.length)],
      };
    }
    function frame() {
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      // nach dem Knall rieselt es dauerhaft leicht weiter
      if (parts.length < 70) parts.push(spawn(false));
      parts = parts.filter(p => p.y < innerHeight + 30);
      for (const p of parts) {
        p.vy = Math.min(p.vy + .25, 4.5);
        p.vx *= .985;
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.scale(1, Math.cos(p.r * 2));
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        ctx.restore();
      }
      requestAnimationFrame(frame);
    }
    return {
      start(n) {
        if (reduceMotion) return;
        const cs = getComputedStyle(root);
        colors = ["--pink", "--orange", "--sky-4"].map(v => cs.getPropertyValue(v).trim()).concat("#ffffff");
        for (let i = 0; i < n; i++) parts.push(spawn(true));
        if (!running) { running = true; resize(); addEventListener("resize", resize); frame(); }
      },
    };
  })();

  /* ---------- Takt ---------- */

  // true, sobald die Seite den Countdown einmal laufen sah – dann gibt's Blitz + großen Konfetti-Knall
  let started = false;

  function tick() {
    const now = Date.now();
    updateSky(now);
    const diff = Math.max(0, RELEASE - now);
    if (diff === 0) {
      if (!released) celebrate(started);
      return;
    }
    started = true;
    const s = Math.floor(diff / 1000);
    const parts = {
      d: Math.floor(s / 86400),
      h: Math.floor(s / 3600) % 24,
      m: Math.floor(s / 60) % 60,
      s: s % 60,
    };
    units.forEach(u => render(u, parts[u.key]));
    el.setAttribute("aria-label",
      `${parts.d} Tage, ${parts.h} Stunden, ${parts.m} Minuten, ${parts.s} Sekunden bis GTA VI`);
    document.title = `${parts.d}T ${String(parts.h).padStart(2, "0")}:${String(parts.m).padStart(2, "0")}:${String(parts.s).padStart(2, "0")} · GTA VI`;
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }

  /* ---------- Neon-Flackern ---------- */

  function flicker() {
    const seq = [70, 60, 130, 50, 40];
    let t = 0;
    seq.forEach((d, i) => {
      setTimeout(() => root.classList.toggle("flick", i % 2 === 0), t);
      t += d;
    });
    setTimeout(() => root.classList.remove("flick"), t);
    setTimeout(flicker, 5000 + Math.random() * 9000);
  }

  /* ---------- Farbschema ---------- */

  const themeBtn = document.getElementById("btn-theme");
  function setTheme(name) {
    if (name === "leonida") root.dataset.theme = "leonida";
    else delete root.dataset.theme;
    store.set("gta6-theme", name);
  }
  setTheme(store.get("gta6-theme") || "vice");
  themeBtn.addEventListener("click", () => setTheme(root.dataset.theme === "leonida" ? "vice" : "leonida"));

  /* ---------- Vollbild ---------- */

  const fullBtn = document.getElementById("btn-full");
  function toggleFullscreen() {
    if (!document.fullscreenEnabled) return;
    if (document.fullscreenElement) document.exitFullscreen();
    else root.requestFullscreen().catch(() => {});
  }
  if (!document.fullscreenEnabled) fullBtn.hidden = true;
  fullBtn.addEventListener("click", toggleFullscreen);
  document.addEventListener("dblclick", e => { if (!e.target.closest(".toolbar")) toggleFullscreen(); });
  document.addEventListener("fullscreenchange", () =>
    fullBtn.setAttribute("aria-pressed", String(!!document.fullscreenElement)));

  /* ---------- Musik: Synthwave-Loop, live im Browser erzeugt ---------- */

  const music = (() => {
    const BPM = 96, STEP = 60 / BPM / 4; // Sechzehntel
    // Am – F – C – G, der Synthwave-Klassiker
    const BARS = [
      { root: 45, notes: [57, 60, 64] },
      { root: 41, notes: [57, 60, 65] },
      { root: 48, notes: [55, 60, 64] },
      { root: 43, notes: [55, 59, 62] },
    ];
    const ARP = [0, 1, 2, 3, 2, 1, 2, 3, 0, 1, 2, 3, 2, 3, 1, 2];
    let ac, master, reverb, delay, noise, timer, nextTime = 0, step = 0, playing = false;
    const mtof = m => 440 * 2 ** ((m - 69) / 12);

    function init() {
      ac = new AudioContext();
      const comp = ac.createDynamicsCompressor();
      master = ac.createGain();
      master.gain.value = 0;
      master.connect(comp).connect(ac.destination);

      const len = ac.sampleRate * 2.8;
      const ir = ac.createBuffer(2, len, ac.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 3;
      }
      reverb = ac.createConvolver();
      reverb.buffer = ir;
      const rg = ac.createGain(); rg.gain.value = .4;
      reverb.connect(rg).connect(master);

      delay = ac.createDelay();
      delay.delayTime.value = STEP * 3;
      const fb = ac.createGain(); fb.gain.value = .38;
      const dg = ac.createGain(); dg.gain.value = .35;
      delay.connect(fb).connect(delay);
      delay.connect(dg).connect(master);

      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const nd = noise.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    }

    function env(t, peak, attack, decay) {
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(.0001, t + attack + decay);
      return g;
    }
    function osc(type, freq, t, stop, detune = 0) {
      const o = ac.createOscillator();
      o.type = type; o.frequency.value = freq; o.detune.value = detune;
      o.start(t); o.stop(stop);
      return o;
    }
    function lowpass(freq, q = .7) {
      const f = ac.createBiquadFilter();
      f.type = "lowpass"; f.frequency.value = freq; f.Q.value = q;
      return f;
    }
    function noiseSrc(t, dur) {
      const s = ac.createBufferSource();
      s.buffer = noise; s.start(t); s.stop(t + dur);
      return s;
    }

    function bass(m, t) {
      const f = lowpass(500, 6);
      f.frequency.setValueAtTime(900, t);
      f.frequency.exponentialRampToValueAtTime(220, t + STEP * 1.6);
      const g = env(t, .32, .005, STEP * 1.8);
      osc("sawtooth", mtof(m), t, t + STEP * 2).connect(f).connect(g).connect(master);
    }
    function pad(notes, t, dur) {
      const f = lowpass(1400);
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.05, t + .5);
      g.gain.setValueAtTime(.05, t + dur - .3);
      g.gain.linearRampToValueAtTime(0, t + dur);
      f.connect(g);
      g.connect(master); g.connect(reverb);
      notes.forEach(n => [-9, 9].forEach(det => osc("sawtooth", mtof(n), t, t + dur, det).connect(f)));
    }
    function arp(m, t) {
      const g = env(t, .05, .003, .2);
      osc("square", mtof(m), t, t + .25).connect(lowpass(2600)).connect(g);
      g.connect(master); g.connect(delay);
    }
    function kick(t) {
      const o = osc("sine", 150, t, t + .4);
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(42, t + .12);
      o.connect(env(t, .9, .002, .35)).connect(master);
    }
    function snare(t) {
      const bp = ac.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 1800; bp.Q.value = .8;
      const g = env(t, .4, .002, .22);
      noiseSrc(t, .3).connect(bp).connect(g);
      g.connect(master); g.connect(reverb);
      osc("triangle", 190, t, t + .12).connect(env(t, .25, .002, .1)).connect(master);
    }
    function hat(t, loud) {
      const hp = ac.createBiquadFilter();
      hp.type = "highpass"; hp.frequency.value = 7500;
      noiseSrc(t, .06).connect(hp).connect(env(t, loud ? .1 : .05, .001, .05)).connect(master);
    }

    function schedule(i, t) {
      const bar = BARS[Math.floor(i / 16)], s = i % 16;
      if (s === 0) pad(bar.notes, t, STEP * 16);
      if (s % 2 === 0) bass(bar.root + (s % 4 === 2 ? 12 : 0), t);
      const tones = [...bar.notes, bar.notes[0] + 12];
      arp(tones[ARP[s]] + 12, t);
      if (s % 8 === 0) kick(t);
      if (s === 4 || s === 12) snare(t);
      if (s % 2 === 0) hat(t, s % 4 === 2);
    }
    function scheduler() {
      while (nextTime < ac.currentTime + .15) {
        schedule(step, nextTime);
        nextTime += STEP;
        step = (step + 1) % (16 * BARS.length);
      }
    }

    return {
      async toggle() {
        if (!ac) init();
        playing = !playing;
        const t = ac.currentTime;
        master.gain.cancelScheduledValues(t);
        master.gain.setValueAtTime(master.gain.value, t);
        if (playing) {
          await ac.resume();
          nextTime = ac.currentTime + .05;
          step = 0;
          clearInterval(timer);
          timer = setInterval(scheduler, 25);
          master.gain.linearRampToValueAtTime(.55, ac.currentTime + 1.5);
        } else {
          master.gain.linearRampToValueAtTime(0, t + .6);
          setTimeout(() => { if (!playing) { clearInterval(timer); ac.suspend(); } }, 700);
        }
        return playing;
      },
    };
  })();

  const musicBtn = document.getElementById("btn-music");
  async function toggleMusic() {
    musicBtn.setAttribute("aria-pressed", String(await music.toggle()));
  }
  musicBtn.addEventListener("click", toggleMusic);

  /* ---------- Tastatur ---------- */

  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === "f") toggleFullscreen();
    else if (k === "m") toggleMusic();
    else if (k === "c") themeBtn.click();
  });

  tick();
  if (!reduceMotion) setTimeout(flicker, 3000);
</script>
</body>
</html>
